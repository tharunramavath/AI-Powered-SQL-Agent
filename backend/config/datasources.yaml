# ============================================================
# Datasource registry.
# Each entry is a queryable database. The connection URL can be set
# directly here or via an env var using `url_env`.
# ============================================================

datasources:
  - id: default
    display_name: "Default datasource"
    # dialect auto-detected from the URL (sqlite / postgresql / mysql / ...)
    # url: postgresql+psycopg://user:pass@localhost:5432/db
    url_env: DATASOURCE_URL
    allowed_roles: []
    max_rows: 500

